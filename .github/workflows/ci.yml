name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  eslint:
    runs-on: ubuntu-latest
    strategy:
        matrix:
          node-version: ['lts/jod']
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup
      uses: ./.github/actions/npm-setup

    - name: Run eslint
      run: npm run lint
  vitest:
    needs: [eslint]
    runs-on: ubuntu-latest
    strategy:
        matrix:
          node-version: ['lts/jod']
          shard: [1/3, 2/3, 3/3]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup
      uses: ./.github/actions/npm-setup

    - name: Run Vitest tests
      run: npm test -- run --shard=${{ matrix.shard }}
    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v6
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  runBuild:
    needs: [eslint]
    runs-on: ubuntu-latest
    # Run in the official Playwright image so code instrumentation matches the environment used for Playwright tests.
    # The image tag must match the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox fails to launch as root unless HOME is root's home directory
      HOME: /root
    strategy:
        matrix:
          node-version: ['lts/jod']
    steps:
    # jq is used by bin/playwright-prepare-ci; git, curl, and gnupg are used by checkout and codecov
    - name: Install system dependencies
      run: apt-get update && apt-get install -y --no-install-recommends jq git curl gnupg

    - name: Checkout code
      uses: actions/checkout@v7

    # The workspace is owned by a different user than the container's root user
    - name: Mark workspace as a safe git directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup
      uses: ./.github/actions/npm-setup

    - name: Run build
      run: npm run prestart-ci
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: static-build
        path: |
          static/dist/
        retention-days: 5

  playwright:
    needs: [runBuild]
    runs-on: ubuntu-latest
    # Run in the official Playwright image so screenshots render the same as `npm run playwright:docker`.
    # The image tag must match the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox fails to launch as root unless HOME is root's home directory
      HOME: /root
    strategy:
        fail-fast: false
        matrix:
          node-version: ['lts/jod']
          shardIndex: [1, 2, 3, 4, 5, 6, 7, 8, 9]
          shardTotal: [9]
    steps:
    # jq is used by bin/playwright-prepare-ci; git, curl, and gnupg are used by checkout and codecov
    - name: Install system dependencies
      run: apt-get update && apt-get install -y --no-install-recommends jq git curl gnupg

    - name: Checkout code
      uses: actions/checkout@v7

    # The workspace is owned by a different user than the container's root user
    - name: Mark workspace as a safe git directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup
      uses: ./.github/actions/npm-setup

    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: static-build
        path: static/dist/
    - name: Run Playwright tests
      run: bin/start-playwright.sh ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - name: Upload coverage to codecov
      uses: codecov/codecov-action@v6
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        directory: 'playwright-coverage'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-${{ strategy.job-index }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30

  tests-passed:
    needs: ['vitest', 'playwright']
    runs-on: ubuntu-latest
    steps:
    - name: All Tests Have Passed
      run: 'echo true'

  deploy:
    if: success() && github.ref == 'refs/heads/main' # only run on main success
    needs: [tests-passed] # only run after all test jobs complete
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_KEY }}
        known_hosts: ${{ secrets.KNOWN_HOSTS }}
    - name: Push to ECC
      run: |
        git remote add ecc ssh://git@git.earthdata.nasa.gov:7999/edsc/edsc.git
        git fetch ecc "+refs/heads/*:refs/remotes/origin/*"

        git fetch --unshallow || true
        echo "GITHUB_COMMIT=$GITHUB_SHA"
        git push ecc $GITHUB_SHA:refs/heads/main
